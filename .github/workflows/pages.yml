name: Deploy demo to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'release-assets.json'
      - 'scripts/download_demo_assets.py'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Check source and evaluation data
        run: python3 scripts/check_repository.py
      - name: Download and verify demo videos
        run: python3 scripts/download_demo_assets.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: website
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
