[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "supermimic-g1-23dof"
version = "0.1.0"
description = "Native 23-DoF G1 SuperMimic reproduction with aligned 50 Hz references"
requires-python = ">=3.11,<3.13"
dependencies = ["numpy", "scipy", "torch>=2.7", "mujoco==3.5.0", "mujoco-warp==3.5.0", "warp-lang==1.12.0", "mjlab==1.2.0", "tyro", "tensorboard", "wandb>=0.24.2"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
sm23 = "supermimic.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"supermimic.robots" = ["*.xml", "assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
